<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naoko — Social Events & Gatherings</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(23, 23, 23, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen pb-24 selection:bg-amber-500 selection:text-black">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 glass border-b border-neutral-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-extrabold text-black text-base shadow-lg shadow-amber-500/20">
        N
      </div>
      <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-neutral-100 via-neutral-300 to-neutral-400 bg-clip-text text-transparent">Naoko</span>
    </div>

    <!-- Toggle Host/Guest -->
    <button id="role-toggle" onclick="toggleRole()" class="text-xs px-3 py-1.5 rounded-full border border-neutral-700 bg-neutral-900/80 text-neutral-300 hover:border-amber-500 transition-all flex items-center gap-1.5">
      <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i>
      <span id="role-label">Mode: Guest</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-5 space-y-6">

    <!-- Hero / Category Filters -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-extrabold tracking-tight">Happening Tonight</h1>
        <span class="text-xs text-amber-400 font-medium px-2 py-0.5 rounded-full bg-amber-400/10 border border-amber-400/20">Cloud Live</span>
      </div>

      <!-- Categories -->
      <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button onclick="filterCategory('All')" class="category-btn px-4 py-2 rounded-full bg-neutral-100 text-neutral-950 font-semibold shadow shrink-0">All</button>
        <button onclick="filterCategory('Cocktail & Bar')" class="category-btn px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Cocktail & Bar</button>
        <button onclick="filterCategory('Live Music')" class="category-btn px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Live Music</button>
        <button onclick="filterCategory('Club & DJ Sets')" class="category-btn px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Club & DJ Sets</button>
      </div>
    </div>

    <!-- Venue Portal Banner -->
    <div id="organizer-banner" class="hidden glass p-4 rounded-2xl border-amber-500/30 bg-amber-950/10 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="store" class="w-4 h-4 text-amber-400"></i>
          <span class="text-sm font-semibold text-neutral-200">Venue & Host Portal</span>
        </div>
        <span class="text-[11px] text-amber-400 font-mono">Live DB</span>
      </div>
      <button onclick="openModal()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-neutral-950 font-bold text-sm shadow-md hover:brightness-110 transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Create Live Event
      </button>
    </div>

    <!-- Feed Events Container (Caricato da Supabase) -->
    <div class="space-y-5" id="events-container">
      <div class="text-center py-12 text-neutral-500 text-xs">Loading live events from Supabase...</div>
    </div>

  </main>

  <!-- Modal Creazione Evento -->
  <div id="create-modal" class="hidden fixed inset-0 z-50 glass bg-black/80 flex items-end sm:items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold">New Gathering</h3>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="text-neutral-400 block mb-1">Event Title</label>
          <input type="text" id="new-title" placeholder="e.g. Secret Rooftop DJ Set" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-neutral-400 block mb-1">Venue Name / Location</label>
          <input type="text" id="new-location" placeholder="e.g. Greenhouse Lounge" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-neutral-400 block mb-1">Date & Time</label>
            <input type="text" id="new-date" placeholder="Tonight • 10:00 PM" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="text-neutral-400 block mb-1">Category</label>
            <select id="new-category" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
              <option value="Cocktail & Bar">Cocktail & Bar</option>
              <option value="Live Music">Live Music</option>
              <option value="Club & DJ Sets">Club & DJ Sets</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-neutral-400 block mb-1">Cover Image URL (Unsplash or web link)</label>
          <input type="text" id="new-cover" placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-neutral-400 block mb-1">Description</label>
          <textarea id="new-desc" rows="2" placeholder="Tell guests what to expect..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500"></textarea>
        </div>
      </div>

      <button id="btn-submit-event" onclick="publishEvent()" class="w-full py-3 rounded-xl bg-amber-500 text-neutral-950 font-bold text-sm shadow hover:brightness-110 transition flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> Publish to Naoko
      </button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-neutral-800 px-6 py-2.5 flex justify-around items-center max-w-md mx-auto z-50">
    <button class="flex flex-col items-center gap-1 text-amber-400">
      <i data-lucide="compass" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Feed</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-neutral-400 hover:text-neutral-200">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Explore</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-neutral-400 hover:text-neutral-200">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">People</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-neutral-400 hover:text-neutral-200">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </button>
  </nav>

  <script>
    // Inizializzazione Supabase con le tue chiavi
    const SUPABASE_URL = "https://rlyrberzchdiyotgellg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ra9TBazygVyYCnog1eTVMA_1kqvFJf7";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentRole = 'user';
    let allEvents = [];

    // Carica gli eventi al caricamento della pagina
    document.addEventListener("DOMContentLoaded", () => {
      fetchEvents();
    });

    async function fetchEvents() {
      const container = document.getElementById('events-container');
      try {
        const { data: events, error } = await supabase
          .from('events')
          .select(`
            id, title, description, cover_url, location_name, event_date, category,
            event_attendees ( id, user_name, user_avatar )
          `)
          .order('created_at', { ascending: false });

        if (error) throw error;
        allEvents = events || [];
        renderEvents(allEvents);
      } catch (err) {
        console.error("Fetch error:", err);
        container.innerHTML = `<div class="p-4 text-center text-rose-400 text-xs">Error loading events. Did you run the SQL script in Supabase?</div>`;
      }
    }

    function renderEvents(events) {
      const container = document.getElementById('events-container');
      if (!events || events.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-neutral-500 text-xs">No events found. Switch to Host mode to publish the first one!</div>`;
        return;
      }

      container.innerHTML = events.map(evt => {
        const attendees = evt.event_attendees || [];
        const count = attendees.length;
        const cover = evt.cover_url || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80';

        return `
          <div class="glass rounded-3xl overflow-hidden shadow-2xl transition hover:border-neutral-700">
            <div class="relative h-48 w-full overflow-hidden">
              <img src="${cover}" alt="Cover" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/40 to-transparent"></div>
              
              <div class="absolute top-3 left-3 flex gap-2">
                <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full glass text-white">${evt.category || 'Gathering'}</span>
              </div>

              <div class="absolute bottom-3 left-4 right-4 flex items-end justify-between">
                <div>
                  <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">${evt.event_date || 'Tonight'}</p>
                  <h2 class="text-xl font-bold leading-tight">${evt.title}</h2>
                </div>
              </div>
            </div>

            <div class="p-4 space-y-4">
              <div class="flex items-center justify-between text-xs text-neutral-400">
                <div class="flex items-center gap-1.5">
                  <i data-lucide="map-pin" class="w-4 h-4 text-rose-400"></i>
                  <span class="font-medium text-neutral-200">${evt.location_name}</span>
                </div>
                <span class="text-neutral-500">Free Entry</span>
              </div>

              <p class="text-xs text-neutral-300 leading-relaxed">${evt.description || ''}</p>

              <div class="border-t border-neutral-800/80 pt-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <div class="flex -space-x-2 overflow-hidden">
                    <img class="inline-block h-7 w-7 rounded-full ring-2 ring-neutral-900 object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80">
                    <img class="inline-block h-7 w-7 rounded-full ring-2 ring-neutral-900 object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80">
                  </div>
                  <span class="text-xs font-medium text-neutral-400">${count > 0 ? `+${count} going` : 'Be the first to join'}</span>
                </div>

                <button onclick="attendEvent('${evt.id}', this)" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-neutral-800 hover:bg-neutral-700 text-white">
                  <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                  <span>Join In</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    async function attendEvent(eventId, btn) {
      btn.disabled = true;
      btn.innerText = "Joining...";

      const { error } = await supabase
        .from('event_attendees')
        .insert([{ event_id: eventId, user_name: 'Guest Explorer', user_avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80' }]);

      if (error) {
        alert("Failed to join event: " + error.message);
        btn.disabled = false;
        btn.innerText = "Join In";
      } else {
        btn.className = "px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-emerald-500 text-black";
        btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Going ✓`;
        lucide.createIcons();
      }
    }

    function toggleRole() {
      const banner = document.getElementById('organizer-banner');
      const label = document.getElementById('role-label');
      if (currentRole === 'user') {
        currentRole = 'organizer';
        label.innerText = 'Mode: Host / Venue';
        banner.classList.remove('hidden');
      } else {
        currentRole = 'user';
        label.innerText = 'Mode: Guest';
        banner.classList.add('hidden');
      }
      lucide.createIcons();
    }

    function openModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('create-modal').classList.add('hidden'); }

    async function publishEvent() {
      const title = document.getElementById('new-title').value.trim();
      const location = document.getElementById('new-location').value.trim();
      const date = document.getElementById('new-date').value.trim();
      const category = document.getElementById('new-category').value;
      const cover = document.getElementById('new-cover').value.trim();
      const desc = document.getElementById('new-desc').value.trim();

      if (!title || !location) {
        alert("Please fill in at least the Title and Location.");
        return;
      }

      const btn = document.getElementById('btn-submit-event');
      btn.innerText = "Publishing...";
      btn.disabled = true;

      const { error } = await supabase
        .from('events')
        .insert([{
          title,
          location_name: location,
          event_date: date || 'Tonight',
          category,
          cover_url: cover,
          description: desc
        }]);

      btn.innerText = "Publish to Naoko";
      btn.disabled = false;

      if (error) {
        alert("Error creating event: " + error.message);
      } else {
        closeModal();
        // Svuota i campi
        document.getElementById('new-title').value = '';
        document.getElementById('new-location').value = '';
        document.getElementById('new-desc').value = '';
        fetchEvents();
      }
    }

    function filterCategory(cat) {
      if (cat === 'All') {
        renderEvents(allEvents);
      } else {
        const filtered = allEvents.filter(e => e.category === cat);
        renderEvents(filtered);
      }
    }
  </script>
</body>
</html>
