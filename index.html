<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naoko — Social Events & Gatherings</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(23, 23, 23, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen pb-24 selection:bg-amber-500 selection:text-black">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 glass border-b border-neutral-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-extrabold text-black text-base shadow-lg shadow-amber-500/20">
        N
      </div>
      <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-neutral-100 via-neutral-300 to-neutral-400 bg-clip-text text-transparent">Naoko</span>
    </div>

    <!-- Toggle Host/Guest -->
    <button id="role-toggle" onclick="toggleRole()" class="text-xs px-3 py-1.5 rounded-full border border-neutral-700 bg-neutral-900/80 text-neutral-300 hover:border-amber-500 transition-all flex items-center gap-1.5">
      <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i>
      <span id="role-label">Mode: Guest</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-5 space-y-6">

    <!-- Hero / Category Filters -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-extrabold tracking-tight">Happening Tonight</h1>
        <span class="text-xs text-amber-400 font-medium px-2 py-0.5 rounded-full bg-amber-400/10 border border-amber-400/20">Cloud Live</span>
      </div>

      <!-- Categories -->
      <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button onclick="filterCategory('All')" class="px-4 py-2 rounded-full bg-neutral-100 text-neutral-950 font-semibold shadow shrink-0">All</button>
        <button onclick="filterCategory('Cocktail & Bar')" class="px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Cocktail & Bar</button>
        <button onclick="filterCategory('Live Music')" class="px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Live Music</button>
        <button onclick="filterCategory('Club & DJ Sets')" class="px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Club & DJ Sets</button>
      </div>
    </div>

    <!-- Venue Portal Banner -->
    <div id="organizer-banner" class="hidden glass p-4 rounded-2xl border-amber-500/30 bg-amber-950/10 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="store" class="w-4 h-4 text-amber-400"></i>
          <span class="text-sm font-semibold text-neutral-200">Venue & Host Portal</span>
        </div>
        <span class="text-[11px] text-amber-400 font-mono">Live DB</span>
      </div>
      <button onclick="openModal()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-neutral-950 font-bold text-sm shadow-md hover:brightness-110 transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Create Live Event
      </button>
    </div>

    <!-- Feed Events Container -->
    <div class="space-y-5" id="events-container">
      <div class="text-center py-12 text-neutral-500 text-xs">Loading live events from Supabase...</div>
    </div>

  </main>

  <!-- Modal Creazione Evento -->
  <div id="create-modal" class="hidden fixed inset-0 z-50 glass bg-black/80 flex items-end sm:items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold">New Gathering</h3>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="text-neutral-400 block mb-1">Event Title</label>
          <input type="text" id="new-title" placeholder="e.g. Secret Rooftop DJ Set" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-neutral-400 block mb-1">Venue Name / Location</label>
          <input type="text" id="new-location" placeholder="e.g. Greenhouse Lounge" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-neutral-400 block mb-1">Date & Time</label>
            <input type="text" id="new-date" placeholder="Tonight • 10:00 PM" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="text-neutral-400 block mb-1">Category</label>
            <select id="new-category" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
              <option value="Cocktail & Bar">Cocktail & Bar</option>
              <option value="Live Music">Live Music</option>
              <option value="Club & DJ Sets">Club & DJ Sets</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-neutral-400 block mb-1">Cover Image URL</label>
          <input type="text" id="new-cover" value="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-neutral-400 block mb-1">Description</label>
          <textarea id="new-desc" rows="2" placeholder="Tell guests what to expect..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500"></textarea>
        </div>
      </div>

      <button id="btn-submit-event" onclick="publishEvent()" class="w-full
