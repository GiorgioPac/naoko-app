<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naoko - Connecting people in Milan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-neutral-900 min-h-screen pb-24 selection:bg-black selection:text-white antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-neutral-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center">
      <!-- Immagine Logo N -->
      <img src="logo.jpg" alt="Naoko N" class="h-7 w-auto object-contain shrink-0">
      
      <!-- Contenitore testo -->
      <div class="flex items-baseline gap-1.5 -ml-1">
        <!-- QUI: -->
        <span class="text-xl font-extrabold tracking-tight text-black translate-y-[4px] translate-x-[0.5px]">aoko</span>
        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-neutral-100 text-neutral-800 border border-neutral-300">MILAN</span>
      </div>
    </div>
    <div id="auth-header-area"></div>
  </header>

  <!-- VIEW 1: EVENT FEED -->
  <main id="view-feed" class="max-w-md mx-auto px-4 pt-5 space-y-6">

    <!-- District Selector -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <i data-lucide="map-pin" class="w-4 h-4 text-black"></i>
          <h2 class="text-xs font-bold uppercase tracking-widest text-neutral-500">Milan Neighborhoods</h2>
        </div>
        <span class="text-[11px] text-neutral-500 font-mono" id="db-status-pill">Cloud Live</span>
      </div>

      <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button onclick="filterDistrict('All', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-black text-white font-bold shadow-sm shrink-0 transition">All</button>
        <button onclick="filterDistrict('Porta Venezia & NoLo', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-black transition shrink-0">Porta Venezia & NoLo</button>
        <button onclick="filterDistrict('Navigli & Darsena', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-black transition shrink-0">Navigli & Darsena</button>
        <button onclick="filterDistrict('Isola & Garibaldi', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-black transition shrink-0">Isola & Garibaldi</button>
        <button onclick="filterDistrict('Brera & Centro', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-black transition shrink-0">Brera & Centro</button>
        <button onclick="filterDistrict('Tortona & P.ta Genova', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-black transition shrink-0">Tortona & P.ta Genova</button>
        <button onclick="filterDistrict('Lambrate', this)" class="district-pill px-3.5 py-1.5 rounded-full bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-black transition shrink-0">Lambrate</button>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="flex gap-1.5 overflow-x-auto pb-1 text-[11px] no-scrollbar">
      <button onclick="filterCategory('All', this)" class="category-pill px-3 py-1 rounded-lg bg-black text-white font-semibold shrink-0 transition">All Categories</button>
      <button onclick="filterCategory('Cocktail Bar & Aperitivo', this)" class="category-pill px-3 py-1 rounded-lg bg-white border border-neutral-200 text-neutral-600 hover:border-black hover:text-black shrink-0 transition">Cocktail & Aperitivo</button>
      <button onclick="filterCategory('Clubbing & DJ Set', this)" class="category-pill px-3 py-1 rounded-lg bg-white border border-neutral-200 text-neutral-600 hover:border-black hover:text-black shrink-0 transition">Club & DJ Set</button>
      <button onclick="filterCategory('Live Music & Jazz', this)" class="category-pill px-3 py-1 rounded-lg bg-white border border-neutral-200 text-neutral-600 hover:border-black hover:text-black shrink-0 transition">Live & Jazz</button>
      <button onclick="filterCategory('Exhibitions & Design', this)" class="category-pill px-3 py-1 rounded-lg bg-white border border-neutral-200 text-neutral-600 hover:border-black hover:text-black shrink-0 transition">Exhibitions & Design</button>
    </div>

    <!-- Host Banner -->
    <div id="organizer-banner" class="p-4 rounded-2xl border border-neutral-200 bg-neutral-50 space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="store" class="w-4 h-4 text-black"></i>
          <span class="text-sm font-bold text-neutral-900">Are you a venue or organizer in Milan?</span>
        </div>
        <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-neutral-200 text-neutral-800 font-semibold">Host Access</span>
      </div>
      <button onclick="handleCreateEventClick()" class="w-full py-2.5 rounded-xl bg-black text-white font-bold text-sm shadow-sm hover:bg-neutral-800 transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Post Event in Milan
      </button>
    </div>

    <!-- Event Cards Container -->
    <div class="space-y-6" id="events-container"></div>
  </main>

  <!-- VIEW 2: INTERACTIVE MAP -->
  <main id="view-map" class="hidden fixed inset-0 top-[57px] bottom-[57px] z-10">
    <!-- Floating District Quick-Jump Bar on Map -->
    <div class="absolute top-3 left-3 right-3 z-[1000] flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
      <button onclick="flyToDistrict('All')" class="px-3 py-1.5 rounded-full bg-black text-white text-xs font-bold shadow-md shrink-0">Reset View</button>
      <button onclick="flyToDistrict('Porta Venezia & NoLo')" class="px-3 py-1.5 rounded-full glass border border-neutral-300 text-xs font-medium text-neutral-800 hover:bg-white hover:text-black shadow-md shrink-0">Porta Venezia</button>
      <button onclick="flyToDistrict('Navigli & Darsena')" class="px-3 py-1.5 rounded-full glass border border-neutral-300 text-xs font-medium text-neutral-800 hover:bg-white hover:text-black shadow-md shrink-0">Navigli</button>
      <button onclick="flyToDistrict('Isola & Garibaldi')" class="px-3 py-1.5 rounded-full glass border border-neutral-300 text-xs font-medium text-neutral-800 hover:bg-white hover:text-black shadow-md shrink-0">Isola</button>
      <button onclick="flyToDistrict('Brera & Centro')" class="px-3 py-1.5 rounded-full glass border border-neutral-300 text-xs font-medium text-neutral-800 hover:bg-white hover:text-black shadow-md shrink-0">Brera</button>
      <button onclick="flyToDistrict('Tortona & P.ta Genova')" class="px-3 py-1.5 rounded-full glass border border-neutral-300 text-xs font-medium text-neutral-800 hover:bg-white hover:text-black shadow-md shrink-0">Tortona</button>
      <button onclick="flyToDistrict('Lambrate')" class="px-3 py-1.5 rounded-full glass border border-neutral-300 text-xs font-medium text-neutral-800 hover:bg-white hover:text-black shadow-md shrink-0">Lambrate</button>
    </div>

    <!-- Map Container -->
    <div id="milano-map" class="w-full h-full"></div>

    <!-- Event Preview Card on Pin Click -->
    <div id="map-preview-card" class="hidden absolute bottom-4 left-4 right-4 max-w-sm mx-auto glass p-3.5 rounded-2xl border border-neutral-200 shadow-2xl z-[1000]"></div>
  </main>

  <!-- VIEW 3: USER PROFILE PAGE -->
  <main id="view-profile" class="hidden max-w-md mx-auto px-4 pt-5 space-y-6">
    <div class="bg-white border border-neutral-200 p-6 rounded-3xl space-y-5 text-center shadow-sm">
      <div class="w-20 h-20 mx-auto rounded-full border-2 border-black p-1">
        <img id="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Avatar" class="w-full h-full rounded-full object-cover">
      </div>

      <div class="space-y-1">
        <h2 id="profile-name" class="text-xl font-bold text-black">Guest User</h2>
        <p id="profile-email" class="text-xs text-neutral-500">email@example.com</p>
        <div class="pt-2 flex justify-center">
          <span id="profile-role-badge" class="text-xs px-3 py-1 rounded-full bg-neutral-100 text-black font-semibold">Guest</span>
        </div>
      </div>

      <div class="border-t border-neutral-200 pt-4 text-left space-y-3 text-xs">
        <div class="flex justify-between items-center py-2 border-b border-neutral-100">
          <span class="text-neutral-500">Instagram Handle</span>
          <span id="profile-instagram" class="font-mono text-black font-medium">Not connected</span>
        </div>
        <div class="flex justify-between items-center py-2">
          <span class="text-neutral-500">Account Type</span>
          <span id="profile-type-desc" class="text-black font-medium">Standard Participant</span>
        </div>
      </div>

      <button onclick="logout()" class="w-full py-3 rounded-xl bg-neutral-100 hover:bg-black hover:text-white text-neutral-800 font-bold text-xs transition flex items-center justify-center gap-2">
        <i data-lucide="log-out" class="w-4 h-4"></i> Sign Out from Naoko
      </button>
    </div>
  </main>

  <!-- MODAL: CLOUD AUTHENTICATION (SIGN UP & LOGIN) -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-neutral-200 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 id="auth-modal-title" class="text-lg font-extrabold text-black">Join Naoko Milan</h3>
        <button onclick="closeAuthModal()" class="text-neutral-400 hover:text-black"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Toggle Sign Up vs Log In -->
      <div class="flex rounded-xl bg-neutral-100 p-1 border border-neutral-200 text-xs">
        <button id="auth-tab-signup" onclick="switchAuthMode('signup')" class="flex-1 py-1.5 rounded-lg bg-black text-white font-semibold transition">Sign Up</button>
        <button id="auth-tab-signin" onclick="switchAuthMode('signin')" class="flex-1 py-1.5 rounded-lg text-neutral-500 hover:text-black font-semibold transition">Log In</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="text-neutral-600 font-medium block mb-1">Email *</label>
          <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
        </div>

        <div>
          <label class="text-neutral-600 font-medium block mb-1">Password *</label>
          <input type="password" id="auth-password" placeholder="Min. 6 characters" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
        </div>

        <!-- Extra Fields for Sign Up only -->
        <div id="auth-signup-fields" class="space-y-3">
          <div>
            <label class="text-neutral-600 font-medium block mb-1">Display Name or Venue Name *</label>
            <input type="text" id="auth-name" placeholder="e.g. Marco Rossi or Bar Basso" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
          </div>

          <div>
            <label class="text-neutral-600 font-medium block mb-1">Instagram Handle (Optional)</label>
            <input type="text" id="auth-instagram" placeholder="@handle" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
          </div>

          <div>
            <label class="text-neutral-600 font-medium block mb-1">Select Role *</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="role-btn-guest" onclick="selectRole('guest')" class="py-2.5 px-2 rounded-xl border-2 border-black bg-neutral-100 text-black font-bold flex flex-col items-center gap-1 transition text-center">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Guest</span>
              </button>
              <button type="button" id="role-btn-host" onclick="selectRole('host')" class="py-2.5 px-2 rounded-xl border border-neutral-200 bg-white text-neutral-400 font-semibold flex flex-col items-center gap-1 transition text-center">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Venue / Host</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <button id="auth-submit-btn" onclick="submitAuth()" class="w-full py-3 rounded-xl bg-black text-white font-bold text-sm shadow hover:bg-neutral-800 transition flex items-center justify-center gap-2">
        <i data-lucide="arrow-right" class="w-4 h-4"></i> Create Account
      </button>
    </div>
  </div>

  <!-- MODAL: CREATE EVENT -->
  <div id="create-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="bg-white border border-neutral-200 rounded-3xl p-5 w-full max-w-md space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-extrabold text-black">New Gathering in Milan</h3>
          <p class="text-[11px] text-neutral-500">Posting as: <span id="host-name-label" class="font-bold text-black"></span></p>
        </div>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-black"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="text-neutral-600 font-medium block mb-1">Event Title *</label>
          <input type="text" id="new-title" placeholder="e.g. Rooftop Sunset Beats" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-neutral-600 font-medium block mb-1">District *</label>
            <select id="new-district" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
              <option value="Porta Venezia & NoLo">Porta Venezia & NoLo</option>
              <option value="Navigli & Darsena">Navigli & Darsena</option>
              <option value="Isola & Garibaldi">Isola & Garibaldi</option>
              <option value="Brera & Centro">Brera & Centro</option>
              <option value="Tortona & P.ta Genova">Tortona & P.ta Genova</option>
              <option value="Lambrate">Lambrate</option>
            </select>
          </div>
          <div>
            <label class="text-neutral-600 font-medium block mb-1">Category *</label>
            <select id="new-category" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
              <option value="Cocktail Bar & Aperitivo">Cocktail Bar & Aperitivo</option>
              <option value="Clubbing & DJ Set">Clubbing & DJ Set</option>
              <option value="Live Music & Jazz">Live Music & Jazz</option>
              <option value="Exhibitions & Design">Exhibitions & Design</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-neutral-600 font-medium block mb-1">Venue & Address *</label>
            <input type="text" id="new-location" placeholder="e.g. Via Lecco 4" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
          </div>
          <div>
            <label class="text-neutral-600 font-medium block mb-1">Nearest Metro</label>
            <input type="text" id="new-metro" placeholder="e.g. M1 Porta Venezia" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-neutral-600 font-medium block mb-1">Date & Time *</label>
            <input type="text" id="new-date" placeholder="Tonight • 9:00 PM" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
          </div>
          <div>
            <label class="text-neutral-600 font-medium block mb-1">Instagram (@handle)</label>
            <input type="text" id="new-ig" placeholder="@venue_milan" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
          </div>
        </div>

        <div>
          <label class="text-neutral-600 font-medium block mb-1">Cover Image URL</label>
          <input type="text" id="new-cover" value="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80" class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black">
        </div>

        <div>
          <label class="text-neutral-600 font-medium block mb-1">Description</label>
          <textarea id="new-desc" rows="2" placeholder="Music style, reservations, entry policy..." class="w-full bg-neutral-50 border border-neutral-300 rounded-xl px-3 py-2 text-black focus:outline-none focus:border-black"></textarea>
        </div>
      </div>

      <button id="btn-publish-submit" onclick="publishEvent()" class="w-full py-3 rounded-xl bg-black text-white font-bold text-sm shadow hover:bg-neutral-800 transition flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> Publish to Milan Feed
      </button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-neutral-200 px-6 py-2.5 flex justify-around items-center max-w-md mx-auto z-40">
    <button id="nav-btn-feed" onclick="switchView('feed')" class="flex flex-col items-center gap-1 text-black">
      <i data-lucide="compass" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">Feed</span>
    </button>
    <button id="nav-btn-map" onclick="switchView('map')" class="flex flex-col items-center gap-1 text-neutral-400 hover:text-black">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Map</span>
    </button>
    <button id="nav-btn-profile" onclick="switchView('profile')" class="flex flex-col items-center gap-1 text-neutral-400 hover:text-black">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </button>
  </nav>

  <!-- External Script -->
  <script src="app.js"></script>
</body>
</html>
