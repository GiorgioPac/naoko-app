<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naoko — Social Events & Gatherings</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(23, 23, 23, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen pb-24 selection:bg-amber-500 selection:text-black">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 glass border-b border-neutral-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-extrabold text-black text-base shadow-lg shadow-amber-500/20">
        N
      </div>
      <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-neutral-100 via-neutral-300 to-neutral-400 bg-clip-text text-transparent">Naoko</span>
    </div>

    <!-- Prototype Role Switcher -->
    <button id="role-toggle" onclick="toggleRole()" class="text-xs px-3 py-1.5 rounded-full border border-neutral-700 bg-neutral-900/80 text-neutral-300 hover:border-amber-500 transition-all flex items-center gap-1.5">
      <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i>
      <span id="role-label">Mode: Guest</span>
    </button>
  </header>

  <!-- Main Container (Mobile First) -->
  <main class="max-w-md mx-auto px-4 pt-5 space-y-6">

    <!-- Hero / Category Filters -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-extrabold tracking-tight">Happening Tonight</h1>
        <span class="text-xs text-amber-400 font-medium px-2 py-0.5 rounded-full bg-amber-400/10 border border-amber-400/20">Live</span>
      </div>

      <!-- Category Badges -->
      <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button class="px-4 py-2 rounded-full bg-neutral-100 text-neutral-950 font-semibold shadow shrink-0">All</button>
        <button class="px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Cocktail & Bar</button>
        <button class="px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Live Music</button>
        <button class="px-4 py-2 rounded-full glass text-neutral-400 hover:text-white transition shrink-0">Club & DJ Sets</button>
      </div>
    </div>

    <!-- Venue / Organizer Dashboard Banner -->
    <div id="organizer-banner" class="hidden glass p-4 rounded-2xl border-amber-500/30 bg-amber-950/10 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="store" class="w-4 h-4 text-amber-400"></i>
          <span class="text-sm font-semibold text-neutral-200">Venue Portal</span>
        </div>
        <span class="text-xs text-neutral-400">Verified Host</span>
      </div>
      <button onclick="alert('Host flow: Opens modal to publish a new event with cover, schedule, and ticketing details.')" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-neutral-950 font-bold text-sm shadow-md hover:brightness-110 transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Create New Event
      </button>
    </div>

    <!-- Event Feed -->
    <div class="space-y-5" id="events-container">

      <!-- Event Card 1 -->
      <div class="glass rounded-3xl overflow-hidden shadow-2xl transition hover:border-neutral-700">
        <!-- Event Cover -->
        <div class="relative h-48 w-full overflow-hidden">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80" alt="Event Cover" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/40 to-transparent"></div>
          
          <div class="absolute top-3 left-3 flex gap-2">
            <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full glass text-white">Cocktails & Vinyl</span>
          </div>

          <div class="absolute bottom-3 left-4 right-4 flex items-end justify-between">
            <div>
              <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">Tonight • 9:00 PM</p>
              <h2 class="text-xl font-bold leading-tight">Vinyl Sunset & Botanicals</h2>
            </div>
          </div>
        </div>

        <!-- Event Body -->
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between text-xs text-neutral-400">
            <div class="flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-4 h-4 text-rose-400"></i>
              <span class="font-medium text-neutral-200">The Greenhouse Rooftop</span>
            </div>
            <span class="text-neutral-500">Free Entry</span>
          </div>

          <p class="text-xs text-neutral-300 leading-relaxed">
            Curated vinyl sets, botanical cocktail pairings, and open rooftop terrace until late night.
          </p>

          <!-- Attendees -->
          <div class="border-t border-neutral-800/80 pt-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="flex -space-x-2 overflow-hidden" id="attendees-avatars">
                <img class="inline-block h-7 w-7 rounded-full ring-2 ring-neutral-900 object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Attendee">
                <img class="inline-block h-7 w-7 rounded-full ring-2 ring-neutral-900 object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80" alt="Attendee">
                <img class="inline-block h-7 w-7 rounded-full ring-2 ring-neutral-900 object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80" alt="Attendee">
              </div>
              <span class="text-xs font-medium text-neutral-400" id="attendees-count">+18 going</span>
            </div>

            <!-- RSVP Button -->
            <button id="btn-attend" onclick="toggleAttend()" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-neutral-800 hover:bg-neutral-700 text-white">
              <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
              <span id="attend-label">Join In</span>
            </button>
          </div>

          <!-- Community Photo Stream -->
          <div class="border-t border-neutral-800/80 pt-3 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-neutral-400 flex items-center gap-1.5">
                <i data-lucide="camera" class="w-3.5 h-3.5 text-amber-400"></i> Event Photo Dump
              </span>
              <button onclick="document.getElementById('photo-input').click()" class="text-xs text-amber-400 hover:underline flex items-center gap-1">
                <i data-lucide="upload" class="w-3 h-3"></i> Add Photo
              </button>
              <input type="file" id="photo-input" class="hidden" accept="image/*" onchange="previewPhoto(event)">
            </div>

            <!-- Photos Grid -->
            <div class="grid grid-cols-4 gap-2" id="photo-gallery">
              <img src="https://images.unsplash.com/photo-1572116469696-31de0f17cc34?auto=format&fit=crop&w=200&q=80" class="h-16 w-full rounded-xl object-cover border border-neutral-800">
              <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=200&q=80" class="h-16 w-full rounded-xl object-cover border border-neutral-800">
            </div>
          </div>

        </div>
      </div>

    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-neutral-800 px-6 py-2.5 flex justify-around items-center max-w-md mx-auto z-50">
    <button class="flex flex-col items-center gap-1 text-amber-400">
      <i data-lucide="compass" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Feed</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-neutral-400 hover:text-neutral-200">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Explore</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-neutral-400 hover:text-neutral-200">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">People</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-neutral-400 hover:text-neutral-200">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </button>
  </nav>

  <!-- Prototype State Logic -->
  <script>
    lucide.createIcons();

    let isAttending = false;
    let count = 18;
    let currentRole = 'user'; // 'user' or 'organizer'

    function toggleAttend() {
      isAttending = !isAttending;
      const btn = document.getElementById('btn-attend');
      const label = document.getElementById('attend-label');
      const countLabel = document.getElementById('attendees-count');

      if (isAttending) {
        btn.className = "px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-emerald-500 text-black";
        label.innerText = "Attending ✓";
        countLabel.innerText = `+${count + 1} going (including you)`;
      } else {
        btn.className = "px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-neutral-800 hover:bg-neutral-700 text-white";
        label.innerText = "Join In";
        countLabel.innerText = `+${count} going`;
      }
    }

    function toggleRole() {
      const banner = document.getElementById('organizer-banner');
      const label = document.getElementById('role-label');
      if (currentRole === 'user') {
        currentRole = 'organizer';
        label.innerText = 'Mode: Host / Venue';
        banner.classList.remove('hidden');
      } else {
        currentRole = 'user';
        label.innerText = 'Mode: Guest';
        banner.classList.add('hidden');
      }
    }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        const gallery = document.getElementById('photo-gallery');
        const img = document.createElement('img');
        img.src = url;
        img.className = 'h-16 w-full rounded-xl object-cover border border-amber-500/50 shadow-md';
        gallery.prepend(img);
      }
    }
  </script>
</body>
</html>
